<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
  <head>
    {% include head.html %}
  </head>
  <body class="{{ page.body_class | default: 'site-page' }}">
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include header.html %}

    <main
      id="main-content"
      class="site-main{% if page.prose or page.url contains '/study-notes/notes/' %} site-main--prose{% endif %}"
      tabindex="-1"
    >
      {{ content }}
    </main>

    {% include footer.html %}
    <script src="{{ '/assets/js/script.js' | relative_url }}?v={{ site.asset_version }}" defer></script>
  </body>
</html>
